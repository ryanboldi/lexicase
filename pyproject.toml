[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexicase"
version = "0.4.0"
description = "Fast, vectorized lexicase selection and its variants, in NumPy and JAX"
readme = "README.md"
authors = [{name = "Ryan Bahlous-Boldi"}]
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "evolutionary-computation",
    "genetic-algorithms",
    "genetic-programming",
    "selection",
    "lexicase",
    "epsilon-lexicase",
    "downsampling",
    "program-synthesis",
    "symbolic-regression",
    "jax",
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.20.0"]

[project.urls]
Homepage = "https://github.com/ryanboldi/lexicase"
Repository = "https://github.com/ryanboldi/lexicase"
Issues = "https://github.com/ryanboldi/lexicase/issues"
Changelog = "https://github.com/ryanboldi/lexicase/blob/main/CHANGELOG.md"

[project.optional-dependencies]
jax = ["jax>=0.4.20"]
dev = ["pytest", "pytest-cov", "ruff"]
examples = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lexicase*"]

[tool.setuptools.package-data]
lexicase = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["UP007", "UP045", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
