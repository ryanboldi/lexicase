site_name: lexicase
site_description: Fast, vectorized lexicase selection and its variants, in NumPy, JAX, and PyTorch
site_url: https://ryanboldi.github.io/lexicase/
repo_url: https://github.com/ryanboldi/lexicase
repo_name: ryanboldi/lexicase
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            heading_level: 3
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Variants:
      - Choosing one: variants/index.md
      - Lexicase: variants/lexicase.md
      - Epsilon lexicase: variants/epsilon.md
      - Downsampled lexicase: variants/downsample.md
      - Informed downsampling: variants/informed-downsample.md
      - Batch lexicase: variants/batch.md
      - Cohort lexicase: variants/cohort.md
      - Plexicase: variants/plexicase.md
      - DALex: variants/dalex.md
      - Weighted case order: variants/case-weights.md
  - Backends: backends.md
  - Benchmarks: benchmarks.md
  - API reference: api.md
  - Contributing: contributing.md
